<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ArXiv Browser{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
    <header class="site-header">
        <nav class="container">
            <ul>
                <li><strong>ArXiv Browser</strong></li>
            </ul>
            <ul>
                <li><a href="{{ url_for('papers_page') }}">Papers</a></li>
                <li><a href="{{ url_for('search_page') }}">Search</a></li>
            </ul>
        </nav>
        <div class="container header-tools">
            <div id="auth-box">
                <input type="text" id="auth-user" placeholder="Username" size="8">
                <input type="password" id="auth-pass" placeholder="Password" size="8">
                <button id="auth-login">Login</button>
                <span id="auth-status"></span>
            </div>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container footer-wrap">
        <div id="stats-box"><small>Loading server status…</small></div>
    </footer>
</body>
</html>
